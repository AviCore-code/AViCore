<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#0d1830"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2038"/>
      <stop offset="100%" stop-color="#091426"/>
    </linearGradient>
    <radialGradient id="flareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#e2e8f0" opacity=".35">
    <circle cx="70" cy="60" r="1.4"/><circle cx="150" cy="120" r="1"/><circle cx="260" cy="50" r="1.2"/>
    <circle cx="720" cy="70" r="1.3"/><circle cx="800" cy="140" r="1"/><circle cx="600" cy="40" r="1"/>
    <circle cx="480" cy="90" r="1.1"/><circle cx="340" cy="30" r="1"/><circle cx="850" cy="90" r="1.2"/>
  </g>

  <!-- sea -->
  <rect x="0" y="560" width="900" height="140" fill="url(#sea)"/>
  <g stroke="#22d3ee" stroke-opacity=".14" fill="none" stroke-width="2">
    <path d="M0 585 Q 40 575 80 585 T 160 585 T 240 585 T 320 585 T 400 585 T 480 585 T 560 585 T 640 585 T 720 585 T 800 585 T 900 585"/>
    <path d="M0 615 Q 45 605 90 615 T 180 615 T 270 615 T 360 615 T 450 615 T 540 615 T 630 615 T 720 615 T 810 615 T 900 615"/>
    <path d="M0 645 Q 50 638 100 645 T 200 645 T 300 645 T 400 645 T 500 645 T 600 645 T 700 645 T 800 645 T 900 645"/>
  </g>

  <!-- ===== Offshore drilling platform ===== -->
  <g id="rig">
    <!-- support legs -->
    <g stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity=".55">
      <path d="M330 470 L230 700"/>
      <path d="M400 470 L340 700"/>
      <path d="M560 470 L620 700"/>
      <path d="M630 470 L720 700"/>
      <path d="M330 470 L630 470"/>
      <path d="M355 560 L605 560"/>
      <path d="M375 630 L580 630"/>
    </g>
    <!-- cross bracing -->
    <g stroke="url(#accent)" stroke-width="3" opacity=".3">
      <path d="M330 470 L400 560"/>
      <path d="M400 470 L330 560"/>
      <path d="M560 470 L630 560"/>
      <path d="M630 470 L560 560"/>
    </g>

    <!-- main deck -->
    <rect x="300" y="450" width="360" height="26" rx="4" fill="url(#accent)" opacity=".85"/>
    <rect x="270" y="440" width="420" height="12" rx="6" fill="url(#accent)"/>

    <!-- derrick / drilling tower -->
    <g stroke="url(#accentSoft)" stroke-width="4" fill="none" opacity=".8">
      <path d="M300 440 L280 300 L320 300 L300 440"/>
      <path d="M282 400 L318 400"/>
      <path d="M286 360 L314 360"/>
      <path d="M290 320 L310 320"/>
    </g>

    <!-- flare stack + flame -->
    <line x1="650" y1="440" x2="670" y2="330" stroke="url(#accentSoft)" stroke-width="4"/>
    <circle cx="672" cy="318" r="26" fill="url(#flareGlow)"/>
    <path d="M672 335 Q660 318 672 300 Q684 318 672 335 Z" fill="#fbbf24" opacity=".85"/>

    <!-- helideck circle with H, slightly left of centre so the helicopter reads as landing onto it -->
    <ellipse cx="430" cy="463" rx="92" ry="16" fill="#0a1120" stroke="url(#accent)" stroke-width="4"/>
    <text x="430" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="url(#accent)">H</text>

    <!-- perimeter lights -->
    <g fill="#22d3ee" opacity=".8">
      <circle cx="310" cy="452" r="3"/><circle cx="650" cy="452" r="3"/>
      <circle cx="480" cy="452" r="3"/><circle cx="380" cy="452" r="3"/>
    </g>
  </g>

  <!-- ===== AW139 descending toward the helideck ===== -->
  <g id="heli" transform="translate(430,250) rotate(-4)">
    <!-- downwash / descent lines -->
    <g stroke="url(#accentSoft)" stroke-width="3" stroke-linecap="round" opacity=".6">
      <line x1="-70" y1="95" x2="-85" y2="150"/>
      <line x1="-20" y1="100" x2="-28" y2="160"/>
      <line x1="30" y1="100" x2="38" y2="160"/>
      <line x1="75" y1="95" x2="90" y2="150"/>
    </g>

    <!-- rotor disc (motion blur) -->
    <ellipse cx="0" cy="-38" rx="150" ry="10" fill="url(#accent)" opacity=".22"/>
    <line x1="-150" y1="-38" x2="150" y2="-38" stroke="url(#accent)" stroke-width="3" opacity=".55"/>
    <rect x="-6" y="-46" width="12" height="14" rx="3" fill="url(#accent)"/>

    <!-- tail boom -->
    <path d="M55 5 C 120 -6, 165 -18, 190 -34" stroke="url(#accent)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- tail rotor -->
    <line x1="188" y1="-52" x2="192" y2="-16" stroke="url(#accent)" stroke-width="4" opacity=".8"/>
    <!-- vertical fin -->
    <path d="M182 -34 L205 -50 L200 -28 Z" fill="url(#accent)"/>

    <!-- cabin body (AW139 rounded nose + sponson silhouette) -->
    <path d="M-95 5
             C -95 -32, -55 -46, 0 -46
             C 45 -46, 62 -34, 62 -10
             C 62 8, 45 18, 10 20
             L -60 20
             C -82 20, -95 14, -95 5 Z"
          fill="url(#accent)"/>

    <!-- cockpit windows -->
    <path d="M-90 -6 C -84 -22, -66 -32, -46 -33 L -46 -6 Z" fill="#0a1120" opacity=".85"/>
    <!-- cabin window strip -->
    <rect x="-38" y="-24" width="80" height="14" rx="4" fill="#0a1120" opacity=".55"/>

    <!-- sponsons (side fuel/float blisters, AW139 signature) -->
    <ellipse cx="-30" cy="18" rx="34" ry="9" fill="url(#accent)" opacity=".9"/>
    <ellipse cx="30" cy="14" rx="26" ry="8" fill="url(#accent)" opacity=".9"/>

    <!-- skids -->
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity=".85">
      <line x1="-70" y1="34" x2="45" y2="34"/>
      <line x1="-62" y1="20" x2="-62" y2="34"/>
      <line x1="20" y1="18" x2="20" y2="34"/>
    </g>

    <!-- nav lights -->
    <circle cx="-95" cy="-2" r="7" fill="url(#navGlow)"/>
    <circle cx="-93" cy="-2" r="2.4" fill="#f87171"/>
  </g>
</svg>
