<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="rgba(148,163,184,.18)" stroke-width="4"/>

  <!-- AviCore sparkle mark ✦ -->
  <path d="M256 96
           C 268 176, 336 244, 416 256
           C 336 268, 268 336, 256 416
           C 244 336, 176 268, 96 256
           C 176 244, 244 176, 256 96 Z"
        fill="url(#spark)"/>
  <!-- inner highlight -->
  <path d="M256 168
           C 262 214, 298 250, 344 256
           C 298 262, 262 298, 256 344
           C 250 298, 214 262, 168 256
           C 214 250, 250 214, 256 168 Z"
        fill="rgba(255,255,255,.30)"/>

  <!-- admin gear badge (bottom-right) -->
  <g transform="translate(372,372)">
    <circle r="70" fill="#0b1220" stroke="url(#spark)" stroke-width="8"/>
    <g fill="#e2e8f0">
      <circle r="22"/>
    </g>
    <g stroke="#e2e8f0" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-46" x2="0" y2="-30"/>
      <line x1="0" y1="46" x2="0" y2="30"/>
      <line x1="-46" y1="0" x2="-30" y2="0"/>
      <line x1="46" y1="0" x2="30" y2="0"/>
      <line x1="-33" y1="-33" x2="-22" y2="-22"/>
      <line x1="33" y1="33" x2="22" y2="22"/>
      <line x1="-33" y1="33" x2="-22" y2="22"/>
      <line x1="33" y1="-33" x2="22" y2="-22"/>
    </g>
    <circle r="10" fill="#0b1220"/>
  </g>
</svg>
